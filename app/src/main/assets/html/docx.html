<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCX Preview</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            margin: 0;
            /* WebView 横向铺满，文档内容保留一层可读内边距。 */
            padding: 12px 20px;
            background: {{BACKGROUND_COLOR}};
            color: {{ON_BACKGROUND_COLOR}};
        }

        /* docx-preview 渲染出的文档容器：Web 视图强制按容器宽度收缩，消除横向滚动 */
        #container > .docx-wrapper {
            background: transparent;
            padding: 0;
            width: 100% !important;
            max-width: 100% !important;
            display: block !important;
        }

        /* 文档 section 也按容器宽度，不再按纸张宽度撑开；内边距由 body 统一提供 */
        #container > .docx-wrapper > section {
            width: 100% !important;
            max-width: 100% !important;
            box-shadow: none !important;
            margin: 0 !important;
            padding: 0 !important;
            background: {{BACKGROUND_COLOR}} !important;
        }

        /* 兜底：任何内部元素超出容器就换行/隐藏，不让横向滚动条出现 */
        #container {
            overflow-x: hidden;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* 渲染失败时显示的错误提示 */
        #error {
            color: {{ERROR_COLOR}};
            padding: 16px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 主题色由 Android 端替换 */
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="error" style="display:none"></div>

    <script type="module">
        import { renderAsync } from 'https://esm.sh/docx-preview@0.4.0';

        // 把 base64 字符串解码成 Uint8Array（二进制安全，不依赖额外库）
        function base64ToUint8Array(b64) {
            const binary = atob(b64);
            const len = binary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        async function renderDocx() {
            const b64 = `{{DOCX_BASE64}}`;
            if (!b64) {
                showError('No document data');
                return;
            }
            try {
                const data = base64ToUint8Array(b64);
                await renderAsync(
                    data,
                    document.getElementById('container'),
                    null,
                    {
                        inWrapper: true,
                        // Web 视图模式：不分页、忽略纸张宽度按容器自适应，内容连续流动便于滚动。
                        breakPages: false,
                        ignoreWidth: true,
                        useBase64URL: true, // 图片/字体内联为 base64，避免 loadDataWithBaseURL 下 blob URL 失效
                        ignoreFonts: false,
                        // 连续流里页眉页脚会突兀，关掉
                        renderHeaders: false,
                        renderFooters: false,
                        renderFootnotes: true,
                        renderEndnotes: true,
                    }
                );
            } catch (error) {
                console.error('docx render error:', error);
                showError('Failed to render document: ' + (error && error.message ? error.message : error));
            }
        }

        function showError(message) {
            const err = document.getElementById('error');
            if (err) {
                err.textContent = message;
                err.style.display = 'block';
            }
        }

        renderDocx();
    </script>
    <script nomodule>
        alert('您的系统WebView不支持 ES Modules，请升级WebView或者系统!');
    </script>
</body>
</html>
