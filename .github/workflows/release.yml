name: Android Release Build

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Detect flavor from tag
        id: flavor
        run: |
          set -euo pipefail

          # zh flavor 已移除，plus 为默认 flavor；标签使用纯版本号（如 1.4.6）。
          flavor="plus"

          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"
          echo "Detected flavor: $flavor (tag: ${GITHUB_REF_NAME})"

      - name: Prepare build files
        env:
          GOOGLE_SERVICES_JSON_B64_PLUS: ${{ secrets.GOOGLE_SERVICES_JSON_B64_PLUS }}
        run: |
          set -euo pipefail

          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          mkdir -p "app/src/$FLAVOR"

          if [[ "$FLAVOR" == "plus" ]]; then
            if [[ -z "${GOOGLE_SERVICES_JSON_B64_PLUS}" ]]; then
              echo "Missing secret: GOOGLE_SERVICES_JSON_B64_PLUS"
              exit 1
            fi
            printf '%s' "${GOOGLE_SERVICES_JSON_B64_PLUS}" | base64 -d > "app/src/plus/google-services.json"
            test -s "app/src/plus/google-services.json"
          else
            echo "Unknown flavor: $FLAVOR"
            exit 1
          fi

          if [ -n "${{ secrets.KEY_BASE64 }}" ]; then
            echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          fi

          if [ -n "${{ secrets.SIGNING_CONFIG }}" ]; then
            echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-ui/package-lock.json

      - name: Install Web UI dependencies
        run: npm ci
        working-directory: web-ui

      - name: Gradle Build Release
        run: |
          set -euo pipefail
          chmod +x gradlew

          FLAVOR="${{ steps.flavor.outputs.flavor }}"
          FLAVOR_CAP="${FLAVOR^}"
          TASK="assemble${FLAVOR_CAP}Release"

          echo "Building release APK ($TASK)..."
          ./gradlew ":app:$TASK" --no-daemon --stacktrace

      - name: Upload build output (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-${{ steps.flavor.outputs.flavor }}
          path: app/build/outputs/apk/${{ steps.flavor.outputs.flavor }}/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/${{ steps.flavor.outputs.flavor }}/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}