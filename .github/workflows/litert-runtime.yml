name: Build LiteRT-LM runtime

on:
  push:
    tags:
      - "litert-runtime-v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  LITERT_LM_VERSION: 0.16.1

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create runtime release for a tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#litert-runtime-v}"
          [[ "$version" == "$LITERT_LM_VERSION" ]] || {
            echo "LiteRT-LM runtime tags must use version $LITERT_LM_VERSION" >&2
            exit 1
          }
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  package:
    runs-on: ubuntu-latest
    needs: prepare-release
    steps:
      - uses: actions/checkout@v4

      - name: Package official LiteRT-LM AAR
        shell: bash
        run: |
          set -euo pipefail
          bash local-runtime/package-litert-runtime.sh --output dist/litert-runtime

      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" \
            dist/litert-runtime/*.zip \
            dist/litert-runtime/*.sha256 \
            --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: flit-litert-runtime-${{ env.LITERT_LM_VERSION }}
          path: |
            dist/litert-runtime/*.zip
            dist/litert-runtime/*.sha256
